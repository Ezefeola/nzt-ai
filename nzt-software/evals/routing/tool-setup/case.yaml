schema_version: "1.1"
name: route-tool-setup
description: >
  A fresh clone whose tech.md declares .NET, ASP.NET Core and Blazor and whose project has
  no agent tools yet. Since D96 there is no catalogue in NZT: the agent finds the tools the
  technologies offer an agent in their official sources (for .NET, Microsoft's own
  documentation MCP server), proposes them with what they bring, and installs them in the
  project's scope only on the user's yes. The failure modes are installing without asking,
  offering user or global scope, naming packs or `nzt-ai project` (gone since D96), and
  proposing a tool with no source. Replaces routing/pack-setup: no baseline.
tags: [routing]
expected_outcome: >
  Loads nzt-architecture or nzt-research and reads the tools guidance, reads the project's
  tech.md, proposes the documentation MCP server for .NET found in Microsoft's sources, with
  `claude mcp add --scope project`, says what it brings and that it loads in a new session,
  and waits for the user's yes before running anything.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Cloné el repo en una máquina nueva. Antes de seguir con US-012, dejá el proyecto listo
    para trabajar con lo que dice el documento técnico.
  max_turns: 25
  timeout_seconds: 650
  # Bash, so the project can be inspected; adding a tool is what must wait.
  allowed_tools: [Read, Glob, Grep, Skill, TodoWrite, Bash, WebSearch, WebFetch]
graders:
  - name: tools-guidance-read
    type: tool_used
    tool: Read
    input_match: 'skills[/\\]+research[/\\]+references[/\\]+tools\.md|skills[/\\]+architecture[/\\]+references[/\\]+tech\.md'
  - name: read-tech
    type: tool_used
    tool: Read
    input_match: 'Docs[/\\]+Architecture[/\\]+tech\.md'
  - name: no-add-without-yes
    type: tool_used
    tool: Bash
    input_match: '(?:claude|codex)\s+(?:mcp|plugin)\s+(?:add|install)|nzt-ai\s+project'
    min: 0
    max: 0
    arm: both
  - name: proposes-the-tools
    type: llm
    criteria: |
      The reply is in Spanish and is about preparing the project to work.
      PASS if it proposes adding a documentation MCP server for .NET from Microsoft's own
      sources (such as Microsoft Learn's) to the project, with `claude mcp add --scope
      project` or by writing it in the project's `.mcp.json`; names where it found it;
      says in a few words what it brings and that it loads in a new session; and asks the
      user to confirm. Offering other tools with their sources besides passes.
      FAIL if it runs any install without asking, if it offers user or global scope even as
      an alternative, if it mentions packs or `nzt-ai project`, if it proposes a tool with
      no source, if it starts US-012 or writes code, or if it never mentions the tools the
      project needs.
