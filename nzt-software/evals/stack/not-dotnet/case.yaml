schema_version: "1.1"
name: stack-not-dotnet
description: >
  nzt-software carries rules for technologies a project may not declare, so the guard
  against applying them where they do not belong is a rule and not a packaging decision.
  Here its dotnet and blazor rules come with the plugin in a TypeScript project, and the work is the same
  shape as the .NET cases - a paginated listing.
tags: [stack, restraint]
expected_outcome: >
  Reads tech.md, builds the listing with Fastify and Prisma, and loads neither
  the dotnet nor the blazor references of nzt-software.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Avanzá con la unidad: el listado de pedidos tiene que venir paginado. Mostrame el
    código.
  max_turns: 30
  timeout_seconds: 700
  allowed_tools: [Read, Glob, Grep, Skill, TodoWrite]
graders:
  - name: no-dotnet-reference
    type: tool_used
    tool: Read
    input_match: 'skills[/\\]+software[/\\]+references[/\\]+dotnet[/\\]+'
    min: 0
    max: 0
    arm: both
  - name: no-blazor-reference
    type: tool_used
    tool: Read
    input_match: 'skills[/\\]+software[/\\]+references[/\\]+blazor[/\\]+'
    min: 0
    max: 0
    arm: both
  - name: no-csharp-in-the-answer
    type: regex
    pattern: 'AsNoTracking|IQueryable|DbContext|```csharp'
    match: not_contains
  - name: builds-with-the-projects-technologies
    type: llm
    criteria: |
      The reply is in Spanish and shows the code of a paginated order listing. This case gives
      no tool to write files, so showing the code without applying it is the expected way to
      deliver it, and saying so is not a failure.
      PASS if the code is TypeScript using the project's own technologies - Fastify and Prisma - and
      follows the conventions of the file it is changing.
      FAIL if it shows no code, if it proposes C#, EF Core or .NET patterns, or if it suggests
      adopting them here.
