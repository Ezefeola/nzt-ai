schema_version: "1.1"
name: stack-ef-listado
description: >
  Inside an approved unit, a paginated read. Two EF Core leaves should meet here - queries
  and pagination - and the conventions they carry should show up in the
  code, ordering that ends in a unique column included.
tags: [stack]
expected_outcome: >
  Loads nzt-software and reads the dotnet EF Core references it selects, and writes a projected,
  ordered, paginated query through the repository tech.md adopted.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Avanzá con la unidad: el listado de pedidos de un cliente, paginado y ordenado del más
    reciente al más antiguo. Mostrame el código.
  max_turns: 35
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, TodoWrite]
graders:
  - name: area-router-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"nzt-software:software"'
  - name: ef-core-pagination-read
    type: tool_used
    tool: Read
    input_match: 'skills[/\\]+software[/\\]+references[/\\]+dotnet[/\\]+ef-core-pagination\.md'
  - name: ef-core-queries-read
    type: tool_used
    tool: Read
    input_match: 'skills[/\\]+software[/\\]+references[/\\]+dotnet[/\\]+ef-core-queries\.md'
  - name: dtos-read
    type: tool_used
    tool: Read
    input_match: 'skills[/\\]+software[/\\]+references[/\\]+csharp[/\\]+dtos\.md'
  - name: wrong-persistence-axis-not-read
    type: tool_used
    tool: Read
    input_match: 'skills[/\\]+software[/\\]+references[/\\]+backend[/\\]+persistence-direct\.md'
    min: 0
    max: 0
    arm: both
  - name: no-tracking-marker-on-a-projection
    type: regex
    pattern: 'AsNoTracking\(\)'
    match: not_contains
  - name: paginates-through-the-shared-extension
    type: regex
    pattern: 'PaginateAsync'
  - name: ordering-ends-in-a-unique-column
    type: llm
    criteria: |
      The reply is in Spanish and contains C# for a paginated read of orders.
      PASS if the query orders before paging and the ordering ends in a unique column, such
      as a ThenBy on the identifier, and if it projects to a response DTO inside the query.
      FAIL if there is no ordering, if the ordering is only by a date or another column that
      can repeat, or if entities are loaded and mapped afterwards with no reason given.
