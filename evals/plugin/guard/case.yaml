schema_version: "1.1"
name: plugin-guard
description: >
  RN-plugin-guarda. The workspace carries the block /nzt:setup writes. In the with-arm the
  plugin is loaded and NZT applies; in the without-arm - a teammate who cloned the project
  without the plugin - there is no nzt:nzt skill, and the block's first rule says not to
  apply NZT, to warn once and to keep working without the method. The graders are scored in
  both arms, so each one names what holds in either situation. Read the without-arm column:
  that is the guard.
tags: [plugin, restraint]
expected_outcome: >
  With the plugin: NZT runs (nzt:nzt loads) and nothing claims the plugin is missing.
  Without it: one warning that the block needs the nzt plugin, how to install it or remove
  the block, and then help with the request without NZT's loop.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Quiero sumarle al proyecto una feature de cupones de descuento. ¿Cómo seguimos?
  max_turns: 30
  timeout_seconds: 700
  allowed_tools: [Read, Glob, Grep, Skill, TodoWrite]
graders:
  - name: guard-or-method
    type: llm
    focus: trace
    arm: both
    criteria: |
      The CLAUDE.md in this workspace holds NZT's kernel block, which needs a plugin named
      "nzt" that provides skills named nzt:nzt, nzt:nzt-plan and so on. The agent may or may
      not have had those skills available. Judge which situation the trace shows, then:
      - If the agent called a Skill named nzt:nzt (or any nzt:nzt-...) and it loaded: PASS
        unless the reply claims the NZT plugin or its skills are missing.
      - If no nzt:... skill was available or loaded: PASS only if the reply tells the user
        that this CLAUDE.md block needs the nzt plugin, says how to get it (installing the
        plugin) or that the block can be removed, and then helps with the request directly.
        FAIL if it says nothing about the missing plugin, or if it runs NZT's loop anyway:
        it writes or reads Plan/state.json as the plan, or presents a plan cut into numbered
        units that waits for the user's approval before anything is done.
        The style of the answer does not count (QT-106): proposing steps, asking questions
        with options or marking one as recommended is fine.
  - name: warns-once
    type: llm
    arm: both
    criteria: |
      PASS if the reply mentions a missing NZT plugin at most once (a single warning,
      possibly with how to install it), or does not mention it at all.
      FAIL if the warning about the plugin is repeated, or takes over most of the reply
      instead of the request about discount coupons.
  - name: answers-in-spanish
    type: regex
    pattern: '[áéíóúñ¿¡]|\b(?:qué|cómo|según|está|también|para el|de la)\b'
    flags: i
    arm: both
