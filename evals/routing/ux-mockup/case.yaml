schema_version: "1.1"
name: route-ux-mockup
description: >
  A mockup of a designed screen, asked for as "an HTML to see how it would look". It reads
  as building the screen (nzt-build, Blazor); it is a visual reference drawn from the screen
  design. Before D50 only the mockup leaf's description carried this; since D50 it is the
  kernel row, and the guide is nzt-ux's references/mockup.md, graded as a Read. New case, no
  baseline (sonnet judge).
tags: [routing]
expected_outcome: >
  Loads nzt-ux, reads its references/mockup.md and the screen design, and proposes one
  self-contained HTML beside the design with every state reachable, as a reference and never
  as code for the project.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Haceme un HTML para ver cómo quedaría la pantalla del historial de pedidos antes de
    programarla.
  max_turns: 25
  timeout_seconds: 700
  allowed_tools: [Read, Glob, Grep, Skill, TodoWrite]
graders:
  - name: ux-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?nzt-ux"'
  - name: mockup-read
    type: tool_used
    tool: Read
    input_match: 'nzt-ux[/\\]+references[/\\]+mockup\.md'
  - name: design-read
    type: tool_used
    tool: Read
    input_match: 'screen-historial\.md'
  - name: not-routed-to-build
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?nzt-build'
    min: 0
    max: 0
    arm: both
  - name: reference-not-code
    type: llm
    criteria: |
      The reply is in Spanish and is about a mockup of the order history screen.
      PASS if it proposes one HTML file that opens from disk with no network, placed beside
      the screen design, showing the states the design lists (loading, empty, many), and it
      treats the file as a reference to look at, not code for the project.
      FAIL if it proposes building the Blazor screen, a file that needs a build step or a
      CDN, or if it invents the empty-state text that the design leaves pending.
