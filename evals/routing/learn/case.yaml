schema_version: "1.1"
name: route-learn
description: >
  The hardest routing decision in the set: the request names a technical topic inside a
  .NET project, so every signal points at build, and the one word that changes everything
  is "aprender". T18 says the learning request is recognised before the work is classified.
  Since D50 the curriculum leaf is nzt-learn's references/plan.md, graded as a Read; baseline
  1.00 (haiku judge) had no grader on it.
tags: [routing]
expected_outcome: >
  Loads nzt-learn, not nzt-build or the EF Core leaves, reads its references/plan.md, and
  starts by finding out what the person already knows.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Quiero aprender a usar bien EF Core en este proyecto: que me enseñes, no que lo hagas
    por mí.
  max_turns: 25
  timeout_seconds: 700
  allowed_tools: [Read, Glob, Grep, Skill, TodoWrite]
graders:
  - name: learn-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?nzt-learn'
  - name: curriculum-read
    type: tool_used
    tool: Read
    input_match: 'nzt-learn[/\\]+references[/\\]+plan\.md'
  - name: did-not-route-to-build
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?nzt-build'
    min: 0
    max: 0
    arm: both
  - name: teaches-instead-of-doing
    type: llm
    criteria: |
      The reply is in Spanish.
      PASS if it establishes what the person already knows or what the objectives are before
      teaching, and offers to teach rather than to implement.
      FAIL if it writes the EF Core code for the project, or if it delivers a lecture with no
      attempt to find out the starting point.
