schema_version: "1.1"
name: route-pack-setup
description: >
  A fresh clone whose tech.md lists the packs of each component (dotnet, ddd, blazor) and
  whose project has no MCP file yet. Since D93 a pack needs no install - its rules come with
  the plugin in nzt-software - so setting up the project is its tools: the Microsoft Learn
  MCP server the .NET packs use, added in the project's scope on the user's yes. The failure
  modes are proposing to install the packs or their skills, running `claude mcp add` or
  `nzt-ai project add` without asking, and inventing a pack. Choosing tools, where catalogue
  and research both run (DB-03), is routing/tool-research.
tags: [routing]
expected_outcome: >
  Loads nzt-architecture and reads its tech.md reference, reads the project's tech.md, says
  the packs need nothing installed, proposes adding the Microsoft Learn MCP server with
  `claude mcp add --scope project`, and waits for the user's yes before running it.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Cloné el repo en una máquina nueva. Antes de seguir con US-012, dejá el proyecto listo
    para trabajar con lo que dice el documento técnico.
  max_turns: 25
  timeout_seconds: 650
  # Bash, so the project can be inspected; adding a tool is what must wait.
  allowed_tools: [Read, Glob, Grep, Skill, TodoWrite, Bash]
graders:
  - name: architecture-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?nzt-architecture"'
  - name: tech-guidance-read
    type: tool_used
    tool: Read
    input_match: 'nzt-architecture[/\\]+references[/\\]+tech\.md'
  - name: read-tech
    type: tool_used
    tool: Read
    input_match: 'Docs[/\\]+Architecture[/\\]+tech\.md'
  - name: no-add-without-yes
    type: tool_used
    tool: Bash
    input_match: 'claude\s+(?:mcp|plugin)\s+(?:add|install)|nzt-ai\s+project\s+(?:add|sync)'
    min: 0
    max: 0
    arm: both
  - name: proposes-the-tools
    type: llm
    criteria: |
      The reply is in Spanish and is about preparing the project to work.
      PASS if it proposes adding the Microsoft Learn MCP server to the project (with
      `claude mcp add --scope project`, or by writing it in the project's `.mcp.json`), says
      in a few words what it brings, and asks the user to confirm. Offering to look for other
      agent tools besides passes.
      FAIL if it proposes installing the packs or their skills, if it runs any install
      without asking, if it proposes a pack tech.md does not list, if it starts US-012 or
      writes code, or if it never mentions the tools the project needs.
