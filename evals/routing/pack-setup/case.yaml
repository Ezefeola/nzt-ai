schema_version: "1.1"
name: route-pack-setup
description: >
  A fresh clone whose tech.md lists the packs of each component, none of them installed
  (D88). Measures that setting up the project goes through nzt-architecture's tech.md
  guidance and `nzt-ai project`: the listed packs are proposed with what each brings and
  installed only on the user's yes. The failure modes are working without the packs as if
  their rules were known, installing without asking, and inventing a pack.
tags: [routing]
expected_outcome: >
  Loads nzt-architecture and reads its tech.md reference, reads the project's tech.md, sees
  that dotnet, ddd and blazor are listed and not installed, proposes `nzt-ai project add
  dotnet ddd blazor` with what each pack brings, and waits for the user's yes before
  running it.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Cloné el repo en una máquina nueva. Antes de seguir con US-012, dejá el proyecto listo
    para trabajar con lo que dice el documento técnico.
  max_turns: 25
  timeout_seconds: 650
  # Bash, so `nzt-ai project packs` or `status` can be run to look; `add` is what must wait.
  allowed_tools: [Read, Glob, Grep, Skill, TodoWrite, Bash]
graders:
  - name: architecture-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?nzt-architecture"'
  - name: tech-guidance-read
    type: tool_used
    tool: Read
    input_match: 'nzt-architecture[/\\]+references[/\\]+tech\.md'
  - name: read-tech
    type: tool_used
    tool: Read
    input_match: 'Docs[/\\]+Architecture[/\\]+tech\.md'
  - name: no-add-without-yes
    type: tool_used
    tool: Bash
    input_match: 'nzt-ai\s+project\s+(?:add|sync)'
    min: 0
    max: 0
    arm: both
  - name: proposes-the-listed-packs
    type: llm
    criteria: |
      The reply is in Spanish and is about preparing the project to work.
      PASS if it says that the packs tech.md lists - dotnet, ddd and blazor - are not
      installed, proposes installing them with `nzt-ai project add` (naming the packs, or
      `sync` once a project file exists), says in a few words what that brings - the pack
      skills, the packs they require, the Microsoft Learn MCP server - and asks the user to
      confirm. Saying that `nzt-ai` is not available here and what to run instead passes.
      FAIL if it runs the install without asking, if it proposes a pack tech.md does not
      list, if it starts US-012 or writes code as if the packs were installed, or if it
      never mentions the packs.
