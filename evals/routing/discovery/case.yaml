schema_version: "1.1"
name: route-discovery
description: >
  A request that is functional analysis, phrased the way a user phrases it - nothing named,
  no skill mentioned. The kernel's routing table should land on nzt-discovery, and the
  phase should not be confused with build.
tags: [routing]
expected_outcome: >
  Loads nzt-discovery (possibly through nzt) and works on the rules and the spec of the
  feature, not on code.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Todavía no tenemos escrito qué hace exactamente el módulo de cupones: cuándo se puede
    aplicar uno, qué pasa si está vencido, si se acumulan. Hay que dejarlo definido.
  max_turns: 14
  timeout_seconds: 420
  allowed_tools: [Read, Glob, Grep, Skill, TodoWrite]
graders:
  - name: discovery-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?nzt-discovery'
  - name: not-routed-to-build
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?nzt-build'
    min: 0
    max: 0
    arm: both
  - name: treats-gaps-as-questions
    type: llm
    criteria: |
      The reply is in Spanish and is about defining the behaviour of the coupons module.
      PASS if the unanswered points - expiry, stacking, when a coupon applies - are raised as
      questions or recorded as open questions for the user to settle.
      FAIL if it invents the business rules and presents them as decided, or if it goes
      straight to code, endpoints or database design.
