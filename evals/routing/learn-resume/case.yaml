schema_version: "1.1"
name: route-learn-resume
description: >
  A learning topic already running, and the person hands in an exercise. The request names a
  source file and asks whether it is right, so it reads as a code review; the topic in
  Learn/ is what makes it a correction. Before D50 only the tutor leaf's description carried
  this; since D50 it is the kernel row and nzt's hand off, and the guide is nzt-learn's
  references/tutor.md, graded as a Read. New case, no baseline (sonnet judge).
tags: [routing]
expected_outcome: >
  Loads nzt-learn, reads its references/tutor.md, and asks the person how confident they are
  in the delivery before saying anything about whether it is right - without rewriting the
  code for them and without routing to build or verify.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Ya terminé el EX-03, lo dejé en ListOrdersByCustomer.cs. ¿Está bien?
  max_turns: 25
  timeout_seconds: 700
  allowed_tools: [Read, Glob, Grep, Skill, TodoWrite]
graders:
  - name: learn-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?nzt-learn"'
  - name: tutor-read
    type: tool_used
    tool: Read
    input_match: 'nzt-learn[/\\]+references[/\\]+tutor\.md'
  - name: router-before-tutor
    type: tool_order
    before: { tool: Skill, input_match: '"skill"\s*:\s*"(?:[\w-]+:)?nzt-learn"' }
    after: { tool: Read, input_match: 'nzt-learn[/\\]+references[/\\]+tutor\.md' }
  - name: did-not-route-to-build-or-verify
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?nzt-(?:build|verify)'
    min: 0
    max: 0
    arm: both
  - name: confidence-before-verdict
    type: llm
    criteria: |
      The reply is in Spanish.
      PASS if, before giving any verdict on the delivery, it asks the person how confident
      they are in what they handed in, and it does not hand over a corrected version of the
      code.
      FAIL if it says what is right or wrong in the delivery before asking for confidence,
      if it never asks for confidence, or if it writes the corrected query for them.
