schema_version: "1.1"
name: route-ux-system
description: >
  The design system, asked for in the words of someone who builds the frontend: colours,
  fonts, common components. It reads as Blazor work (nzt-build); it is a cross-screen UX
  decision. Before D50 only the system leaf's description carried this; since D50 it is the
  kernel row, and the guide is nzt-ux's references/system.md, graded as a Read. New case,
  no baseline (sonnet judge).
tags: [routing]
expected_outcome: >
  Loads nzt-ux, reads its references/system.md, and proposes the design system as roles with
  their use and limit, separate from the shared component inventory, without writing CSS or
  components.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Necesitamos definir los colores, las tipografías y los componentes comunes del front,
    así todas las pantallas se ven iguales.
  max_turns: 25
  timeout_seconds: 700
  allowed_tools: [Read, Glob, Grep, Skill, TodoWrite]
graders:
  - name: ux-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?nzt-ux"'
  - name: system-read
    type: tool_used
    tool: Read
    input_match: 'nzt-ux[/\\]+references[/\\]+system\.md'
  - name: not-routed-to-build
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?nzt-build'
    min: 0
    max: 0
    arm: both
  - name: roles-not-tokens
    type: llm
    criteria: |
      The reply is in Spanish and is about the visual direction and shared components of
      the orders product.
      PASS if it proposes the design system as roles - what each one is used for and its
      limit - and treats the shared component inventory as a separate document or unit.
      FAIL if it writes CSS, a theme file or Blazor components, or if it proposes the design
      system as a catalogue of colour and font values.
