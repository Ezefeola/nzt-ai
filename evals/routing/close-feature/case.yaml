schema_version: "1.1"
name: route-close-feature
description: >
  A feature the user accepts, with its change markers still in the spec. Closing is a unit
  of its own, and it is the one that sweeps them: the route is nzt-plan and its close leaf.
  Without it the markers stay forever and the spec quietly becomes a lie. Since D50 the
  leaf is nzt-plan's references/close.md, graded as a Read; baseline 0.50 (haiku judge).
tags: [routing]
expected_outcome: >
  Loads nzt-plan, reads its references/close.md, the story and the spec, and proposes the close -
  markers swept, the removed rule gone from the spec, the history entry written - without
  offering to delete the regression that proves the absence.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Ya revisé todo lo de F-001 y para mí está listo. Cerremos la feature.
  max_turns: 30
  timeout_seconds: 700
  allowed_tools: [Read, Glob, Grep, Skill, TodoWrite]
graders:
  - name: close-fired
    type: tool_used
    tool: Read
    input_match: 'nzt-plan[/\\]+references[/\\]+close\.md'
  - name: router-before-leaf
    type: tool_order
    before: { tool: Skill, input_match: '"skill"\s*:\s*"(?:[\w-]+:)?nzt-plan"' }
    after: { tool: Read, input_match: 'nzt-plan[/\\]+references[/\\]+close\.md' }
  - name: read-the-spec
    type: tool_used
    tool: Read
    input_match: 'F-001'
  - name: sweeps-and-records
    type: llm
    criteria: |
      The reply is in Spanish and is about closing F-001.
      PASS if it names the two markers it has to resolve - the [remove] on RN-03 and the
      [modify] on CA-04 - says the retired rule disappears from the spec, and says the
      change gets an entry in the history because that is the only record left of it.
      FAIL if it reports the feature closed without touching the markers, if it proposes
      deleting the criterion or the test that proves the anulled orders are not listed, or
      if it treats closing as a deployment.
