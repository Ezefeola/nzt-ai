schema_version: "1.1"
name: restraint-small-edit
description: >
  One word on one button, in a file that already exists. The kernel scales the method to
  the request and the area routers let a small edit follow the convention next to it
  without reloading guidance. Loading the Blazor leaves here is the measurable form of
  over-triggering inside a phase.
tags: [restraint]
expected_outcome: >
  Makes the change, or shows it, without loading the component or render leaves and without
  turning a label change into a unit of work.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    En la pantalla de detalle el botón dice "Guardar" y tiene que decir "Confirmar".
    Cambialo.
  max_turns: 14
  timeout_seconds: 480
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: no-blazor-reference-read
    type: tool_used
    tool: Read
    input_match: 'nzt-build-frontend-blazor[/\\]+references[/\\]+'
    min: 0
    max: 0
    arm: both
  - name: found-the-file
    type: tool_used
    tool: Read
    input_match: 'OrderDetail'
  - name: stays-the-size-of-the-request
    type: llm
    criteria: |
      The reply is in Spanish and is about changing the button label from Guardar to
      Confirmar in OrderDetail.razor.
      PASS if it makes or shows exactly that change.
      FAIL if it proposes a plan or units for it, rewrites the component, adds states,
      refactors anything nearby, or asks for approval before a one-word label change.
