schema_version: "1.1"
name: restraint-trivial
description: >
  A question that is not work. NZT is fully installed and the kernel is in context, and the
  correct behaviour is to answer - no skill, no plan, no state file. Over-triggering is the
  failure mode that makes a set like this unbearable to use.
tags: [restraint, smoke]
expected_outcome: >
  A short answer in Spanish explaining the expression, with no Skill call.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Explicame qué valida esta expresión regular: ^(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}$
  max_turns: 6
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: no-skill-at-all
    type: tool_used
    tool: Skill
    min: 0
    max: 0
    arm: both
  - name: answers-the-question
    type: llm
    criteria: |
      PASS if the reply is in Spanish and explains that the expression requires at least
      eight characters with at least one digit, one lowercase and one uppercase letter.
      FAIL if it proposes a plan, asks for approval, offers to write a spec, or explains how
      it would work on this instead of answering.
