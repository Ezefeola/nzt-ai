schema_version: "1.1"
name: restraint-no-diagram
description: >
  A question about one endpoint's shape, answered from the stack document. The diagram
  catalog is a closed set that only opens when a document earns one, so loading it here -
  or drawing anything - is the measurable form of over-triggering the new branch.
tags: [restraint]
expected_outcome: >
  Answers with the project's own convention, with no diagram skill loaded and no picture
  drawn.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    ¿Cómo devuelve este proyecto los errores de validación en un endpoint? Quiero saber
    con qué forma ya trabaja, nada más.
  max_turns: 14
  timeout_seconds: 480
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: no-diagram-skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?nzt-architecture-diagrams'
    min: 0
    max: 0
    arm: both
  - name: no-mermaid-drawn
    type: regex
    pattern: 'flowchart |sequenceDiagram|stateDiagram'
    match: not_contains
    arm: both
  - name: reads-the-stack
    type: tool_used
    tool: Read
    input_match: 'backend-stack'
  - name: answers-from-the-project
    type: llm
    criteria: |
      The reply is in Spanish and answers how validation errors are returned.
      PASS if the answer comes from the project's own stack document - the result pattern
      translated to HTTP with result extensions - and stays the size of the question.
      FAIL if it draws a diagram, proposes a plan or units, offers to write the product
      architecture, or answers with a convention the stack document does not select.
