schema_version: "1.1"
name: restraint-design-unasked
description: >
  A story that is already fully specified and earns no technical design: one list, read
  through the API the screen already uses, no third party and no states. D41 made the
  feature design an offered artifact, so writing one here - or stopping the work to run a
  round of technical questions - is the measurable form of over-triggering it.
tags: [restraint]
expected_outcome: >
  Goes to building US-012 against its criteria, with no technical design written and no
  question round opened. Saying in one line that this story earns no design is correct;
  producing one is not.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Implementá US-012, el listado de pedidos por cliente. Los criterios ya están escritos.
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, TodoWrite]
graders:
  # Since D50 the design guidance is a file the architecture router sends you to read, not a
  # skill: the same restraint, measured on the Read (design-feature or design-product).
  - name: no-design-leaf
    type: tool_used
    tool: Read
    input_match: 'nzt-architecture[/\\]+references[/\\]+design-'
    min: 0
    max: 0
    arm: both
  - name: no-qt-ids
    type: regex
    pattern: 'QT-0'
    match: not_contains
    arm: both
  - name: reads-the-story
    type: tool_used
    tool: Read
    input_match: 'US-012'
  - name: goes-to-build
    type: llm
    criteria: |
      The reply is in Spanish and is about implementing the order listing of US-012.
      PASS if it goes at the story - reading its criteria and the stacks, and proposing or
      starting the work against them. A single line saying this story earns no technical
      design, or offering one the user can drop, still passes.
      FAIL if it produces a technical design document, opens a round of technical questions
      before building, asks the user to choose how the design gets resolved, or treats the
      design as something required before the story can be built.
      What counts as that round is the design's: questions about how to solve it - who
      validates, where it is persisted, how components talk - written as a set to settle
      before building. A question about a gap in the story (what an unknown customer
      returns) or about the scope of the work (whether to set up the missing project base)
      is not that round, and does not fail on its own. Stopping for the plan's approval -
      NZT's main stop - or because the session cannot write files is not a failure either:
      what is judged is whether the work it proposes is building the story, with no design
      step in front of it.
