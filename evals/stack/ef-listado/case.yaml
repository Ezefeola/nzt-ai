schema_version: "1.1"
name: stack-ef-listado
description: >
  Inside an approved unit, a paginated read. Three EF Core leaves should meet here - the
  common one, queries and pagination - and the conventions they carry should show up in the
  code, ordering that ends in a unique column included.
tags: [stack]
expected_outcome: >
  Loads the .NET area router and the EF Core leaves it selects, and writes a projected,
  ordered, paginated query through the repository the stack adopted.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Avanzá con la unidad: el listado de pedidos de un cliente, paginado y ordenado del más
    reciente al más antiguo. Mostrame el código.
  max_turns: 35
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, TodoWrite]
graders:
  - name: area-router-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?nzt-build-backend-dotnet"'
  - name: ef-core-leaves-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?nzt-build-backend-dotnet-ef-core'
  - name: wrong-persistence-axis-not-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?nzt-build-backend-dotnet-persistence-direct"'
    min: 0
    max: 0
    arm: both
  - name: no-tracking-on-the-read
    type: regex
    pattern: 'AsNoTracking\(\)'
  - name: paginates-through-the-shared-extension
    type: regex
    pattern: 'PaginateAsync'
  - name: ordering-ends-in-a-unique-column
    type: llm
    criteria: |
      The reply is in Spanish and contains C# for a paginated read of orders.
      PASS if the query orders before paging and the ordering ends in a unique column, such
      as a ThenBy on the identifier, and if it projects to a response DTO inside the query.
      FAIL if there is no ordering, if the ordering is only by a date or another column that
      can repeat, or if entities are loaded and mapped afterwards with no reason given.
