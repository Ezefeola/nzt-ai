schema_version: "1.1"
name: stack-not-dotnet
description: >
  A pack can sit in a project whose tech.md does not list it (D88), so the guard against
  applying it where it does not belong is a rule and not a packaging decision. Here the
  dotnet and blazor packs are installed in a TypeScript project, and the work is the same
  shape as the .NET cases - a paginated listing.
tags: [stack, restraint]
expected_outcome: >
  Reads tech.md, builds the listing with Fastify and Prisma, and loads neither
  the nzt-dotnet nor the nzt-blazor pack.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Avanzá con la unidad: el listado de pedidos tiene que venir paginado. Mostrame el
    código.
  max_turns: 30
  timeout_seconds: 700
  allowed_tools: [Read, Glob, Grep, Skill, TodoWrite]
graders:
  - name: no-dotnet-area-skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?nzt-dotnet'
    min: 0
    max: 0
    arm: both
  - name: no-blazor-area-skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?nzt-blazor'
    min: 0
    max: 0
    arm: both
  - name: no-csharp-in-the-answer
    type: regex
    pattern: 'AsNoTracking|IQueryable|DbContext|```csharp'
    match: not_contains
  - name: builds-with-the-projects-technologies
    type: llm
    criteria: |
      The reply is in Spanish and delivers a paginated order listing.
      PASS if the code is TypeScript using the project's own technologies - Fastify and Prisma - and
      follows the conventions of the file it is changing.
      FAIL if it proposes C#, EF Core or .NET patterns, or if it suggests adopting them here.
