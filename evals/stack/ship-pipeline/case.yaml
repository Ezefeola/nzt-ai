schema_version: "1.1"
name: stack-ship-pipeline
description: >
  The D50 pilot case. The CI gates of a .NET component are asked for, and the .NET pipeline
  guidance is what makes the difference: the project pins its SDK and enables two test
  levels, but has no lock files, so a locked-mode restore would be a gate that always passes.
  Before D50 the guidance is the leaf skill; after it, the file references/pipeline.md that
  the area router's table sends the agent to read. The leaf grader changes form; the judge
  does not. Baseline before D50, with the leaf graders on Skill and --judge-model sonnet:
  0.75 (2026-10-03). Run it with --judge-model sonnet: haiku failed replies that met all
  four conditions.
tags: [stack]
expected_outcome: >
  Goes through nzt-ship and its .NET area router, gets the pipeline guidance, and writes a
  workflow whose gates hold: the pinned SDK, a restore that either has lock files or reports
  that they are missing and proposes them, separate unit and integration test steps with a
  container runtime for the integration level, and the pending model changes gate.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Armá el workflow de GitHub Actions para Pedidos.Api con los gates de CI. Mostramelo acá,
    todavía no lo commitees.
  max_turns: 30
  timeout_seconds: 700
  allowed_tools: [Read, Glob, Grep, Skill, TodoWrite]
graders:
  - name: area-router-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?nzt-ship-backend-dotnet"'
  - name: pipeline-guidance-reached
    type: tool_used
    tool: Read
    input_match: 'nzt-ship-backend-dotnet[/\\]+references[/\\]+pipeline\.md'
  - name: other-rows-not-loaded
    type: tool_used
    tool: Read
    input_match: 'nzt-ship-backend-dotnet[/\\]+references[/\\]+observability\.md'
    min: 0
    max: 0
  - name: gates-that-hold
    type: llm
    criteria: |
      The reply is in Spanish and shows a GitHub Actions workflow for Pedidos.Api.
      Judge the whole reply, the YAML and the prose around it together. PASS if all four hold:
      (a) the SDK is installed from global.json (for example `global-json-file`), not from a
      hand-typed version;
      (b) the reply says, anywhere, that the repository has no packages.lock.json (or no
      RestorePackagesWithLockFile), so a locked-mode restore would lock nothing - and proposes
      adding them or leaves locked mode out;
      (c) unit tests and integration tests are two separate steps, and the integration step
      can reach a container runtime - a runner image that ships Docker counts, said in a
      comment or in the prose;
      (d) there is a step for EF Core pending model changes.
      FAIL if any of the four is absent from the reply, or if it raises the SDK or the target
      framework.
