schema_version: "1.1"
name: stack-result-inline
description: >
  A use case with several failing branches, which is where the model's DRY instinct fires:
  it collapses the repeated Result into a private Rejected() helper. D39 forbids that - the
  Result is built at each return, because the status and the message are what a reader came
  for. The prompt asks for three failures on purpose.
tags: [stack]
expected_outcome: >
  Loads the use-case and Result leaves and writes ExecuteAsync with each failure returning
  Result<T>.Failure inline, with its status code and the message from the entity's Errors:
  404 at the null check, 409 at the error list the entity's Confirm returns.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Avanzá con la unidad: el caso de uso que confirma un pedido. Falla si el pedido no
    existe, si ya está confirmado y si no tiene ninguna línea. Mostrame el código.
  max_turns: 35
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, TodoWrite]
graders:
  - name: use-case-reference-read
    type: tool_used
    tool: Read
    input_match: 'nzt-build-backend-dotnet[/\\]+references[/\\]+use-cases\.md'
  - name: no-private-method-returning-a-result
    type: regex
    pattern: 'private\s+(static\s+)?(async\s+)?(Task<)?Result<'
    match: not_contains
  - name: builds-the-result-at-every-return
    type: llm
    criteria: |
      The reply is in Spanish and contains C# for a use case that confirms an order. The
      story gives 404 when the order does not exist, and 409 for both failures the entity
      owns - already confirmed, no lines - so in DDD the entity's Confirm method returns its
      error list and the use case returns it.
      PASS if every return that fails is Result<...>.Failure(...) written at that return,
      with its status code and messages from the entity's Errors: the 404 at the null check,
      and the 409 at the check of the error list Confirm returned (one return for that list
      is the domain pattern, not a collapse). Checking each entity failure separately, each
      with its own inline Failure, also passes.
      FAIL if any failure returns through a private helper, a local function or a field that
      builds the Result - a Rejected(), NotFound() or similar - even if the rest are inline,
      or if the not-found failure is merged with the entity's failures into one return.
